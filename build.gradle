plugins {
    id 'java'
    id 'idea'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'sunanticheat'
version = '2.0.38'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    // Fallback local — préchargé par CI ou sur poste dev si CDN indisponible
    maven { url = 'file:///tmp/local-maven-repo' }
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://repo.lucko.me/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.19.0'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'com.github.Gypopo:EconomyShopGUI-API:1.9.0'
    compileOnly 'net.luckperms:api:5.4'

    // Dashboard — shaded dans le JAR final
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-gson:0.12.6'
    implementation 'at.favre.lib:bcrypt:0.10.2'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.0'
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.4.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    filesMatching('plugin.yml') {
        expand 'version': project.version
    }
}

shadowJar {
    archiveBaseName.set('SunAntiCheat')
    archiveVersion.set(version)
    archiveClassifier.set('')

    mergeServiceFiles()

    relocate 'org.java_websocket', 'sunanticheat.deps.websocket'
    relocate 'io.jsonwebtoken',    'sunanticheat.deps.jwt'
    relocate 'at.favre.lib',       'sunanticheat.deps.bcrypt'

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/NOTICE*'
    exclude 'META-INF/LICENSE*'
}

jar.enabled = false
assemble.dependsOn(shadowJar)

task generateUpdateManifest {
    inputs.dir  'src/main/resources'
    outputs.file 'src/main/resources/update-manifest.json'

    doLast {
        def files = []
        fileTree(dir: 'src/main/resources', include: '*.yml').each { f ->
            int configVersion = 0
            def m = (f.text =~ /(?m)^config-version:\s*(\d+)/)
            if (m.find()) configVersion = m.group(1).toInteger()
            files << [name: f.name, configVersion: configVersion, userEditable: true]
        }
        def manifest = [
            pluginVersion: project.version,
            generatedAt  : new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone('UTC')),
            files        : files
        ]
        def json = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest))
        file('src/main/resources/update-manifest.json').text = json
    }
}
processResources.dependsOn generateUpdateManifest

name: SunAntiCheat
version: ${version}
main: sunanticheat.SunAntiCheat
api-version: '1.21'
description: Plugin anticheat pour Minecraft 1.21.1
author: Sun
softdepend: [PlaceholderAPI, Vault, WeaponMechanics, Multiverse-Inventories, EconomyShopGUI, EconomyShopGUI-Premium]

commands:
  sunguard:
    description: "Menu, reload, mvinvscan, chestscan, blocklog, sanctions, reports, rollback, firstjoin"
    usage: "/sunguard [reload|mvinvscan [joueur]|chestscan <monde1,monde2,...>|blocklog|sanction [joueur]|reports|rollback <joueur> [rayon] [min]|firstjoin ...]"
  xray:
    description: "Menu anti-x-ray ou réinitialisation des scores"
    usage: "/xray [reset <joueurs>]"
  sunplaytime:
    description: "Affiche le temps de jeu (soi-même, un joueur ou top 5)"
    usage: "/sunplaytime [joueur|top [n]]"
  report:
    description: "Signaler un joueur"
    usage: "/report <joueur> <raison>"

permissions:
  sunguard.reload:
    description: "Permet de recharger la configuration du plugin"
    default: op
  sunguard.mvinv.scan:
    description: "Analyser les inventaires Multiverse-Inventories du monde spawn (WM)"
    default: op
  sunguard.chestscan:
    description: "Analyser les conteneurs chargés de mondes ciblés"
    default: op
  sunguard.xray.reset:
    description: "Permet de réinitialiser les scores X-Ray des joueurs"
    default: op
  sunguard.menu:
    description: "Permet d'ouvrir le menu principal anticheat"
    default: op
  sunguard.xray.gui:
    description: "Permet d'ouvrir le menu anti-x-ray"
    default: op
  sunguard.inventory.gui:
    description: "Permet de voir les inventaires complets des joueurs"
    default: op
  sunguard.freecam.gui:
    description: "Permet d'ouvrir le menu Anti Freecam"
    default: op
  sunguard.client.gui:
    description: "Permet de voir les infos client"
    default: op
  sunguard.sanction.gui:
    description: "Permet d'ouvrir le menu des sanctions"
    default: op
  sunguard.playerdata.gui:
    description: "Permet d'ouvrir la fiche joueur"
    default: op
  sunguard.blocklog.check:
    description: "Utiliser le mode blocklog"
    default: op
  sunguard.blocklog.rollback:
    description: "Annuler les actions blocs d'un joueur"
    default: op
  sunguard.alerts:
    description: "Recevoir les alertes en jeu (X-Ray, Freecam, Kill Aura)"
    default: op
  sunguard.bypass.xray:
    description: "Exclu des contrôles anti X-Ray"
    default: op
  sunguard.bypass.freecam:
    description: "Exclu des contrôles anti Freecam"
    default: op
  sunguard.bypass.killaura:
    description: "Exclu des contrôles anti Kill Aura"
    default: op
  sunguard.bypass.wm-main-world:
    description: "Exclu de la détection WeaponMechanics dans le monde principal"
    default: op
  sunguard.bypass.spawn-weapon-strip:
    description: "Exclu du nettoyage inventaire/potions sur les mondes spawn"
    default: op
  sunguard.bypass.mv-inv-spawn-wm-scan:
    description: "Exclu du scan MV-Inv spawn"
    default: op
  sunguard.bypass.risky-command-block:
    description: "Exclu du blocage des commandes sensibles"
    default: op
  sunguard.report:
    description: "Signaler un joueur (/report)"
    default: true
  sunguard.report.view:
    description: "Voir et gérer les signalements"
    default: op
  sunguard.debug:
    description: "Ouvrir le menu debug"
    default: op
  sunguard.firstjoin.manage:
    description: "Gérer la configuration first join"
    default: op
  sunguard.playtime:
    description: "Permet de voir son propre temps de jeu"
    default: true
  sunguard.playtime.others:
    description: "Permet de voir le temps de jeu des autres joueurs"
    default: op
  sunguard.dashboard:
    description: "Accès au dashboard web (admin uniquement)"
    default: op
